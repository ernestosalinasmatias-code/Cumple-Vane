<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Vaneliz!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Canvas de fuegos artificiales */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor de flores y corazones flotantes */
        #floatingItemsContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .floating-item {
            position: absolute;
            animation: floatUp 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            20% {
                opacity: 1;
                transform: scale(1.1) translateY(0);
            }
            80% {
                opacity: 1;
                transform: scale(1) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: scale(0.6) translateY(-60px);
            }
        }

        /* Marco de Texto LED Neón */
        .card-container {
            position: relative;
            z-index: 10;
            padding: 4px;
            border-radius: 24px;
            background: linear-gradient(45deg, #ff007f, #ffd700, #00f0ff, #7928ca, #ff0055);
            background-size: 300% 300%;
            animation: ledBorder 4s ease infinite;
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.6), 0 0 50px rgba(0, 240, 255, 0.4);
            max-width: 85%;
            width: 360px;
        }

        @keyframes ledBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-content {
            background: rgba(10, 10, 10, 0.92);
            border-radius: 20px;
            padding: 30px 20px;
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Texto con fade de 3 segundos */
        .message {
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease;
            transform: scale(0.92);
            position: absolute;
            padding: 0 15px;
        }

        .message.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Colores Neón para las frases */
        .neon-yellow { color: #ffe600; text-shadow: 0 0 10px #ffe600, 0 0 20px #ffaa00; }
        .neon-pink { color: #ff2a85; text-shadow: 0 0 10px #ff2a85, 0 0 25px #ff0055; }
        .neon-cyan { color: #00f3ff; text-shadow: 0 0 10px #00f3ff, 0 0 25px #00aaff; }
        .neon-purple { color: #d000ff; text-shadow: 0 0 10px #d000ff, 0 0 25px #7a00ff; }
        .neon-gold { color: #ffd700; text-shadow: 0 0 10px #ffd700, 0 0 25px #ff8800; }

        .hint {
            position: absolute;
            bottom: 25px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1px;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div id="floatingItemsContainer"></div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="card-container">
        <div class="card-content">
            <div id="messageDisplay" class="message neon-yellow active">¡Feliz Cumpleaños Vaneliz! 🌻</div>
        </div>
    </div>

    <div class="hint">✨ Toca la pantalla ✨</div>

    <script>
        // --- 1. Frases en Loop (Cada 3 segundos) ---
        const phrases = [
            { text: "¡Feliz Cumpleaños Vaneliz! 🌻", class: "neon-yellow" },
            { text: "¡Felices 23 años! 🎉✨", class: "neon-cyan" },
            { text: "Por más coscorrones juntos 😜👊", class: "neon-pink" },
            { text: "Otro año más para poder castigarte... 😏", class: "neon-purple" },
            { text: "Que este nuevo año esté lleno de éxitos 🚀🌟", class: "neon-gold" },
            { text: "Que cumplas cada una de tus metas 🎯💖", class: "neon-cyan" },
            { text: "Muchos años más de felicidad y bendiciones 🎂✨", class: "neon-pink" },
            { text: "¡Sigue brillando siempre! 🌻💛", class: "neon-yellow" }
        ];

        let currentIndex = 0;
        const display = document.getElementById('messageDisplay');

        setInterval(() => {
            display.classList.remove('active');
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % phrases.length;
                display.innerText = phrases[currentIndex].text;
                display.className = 'message ' + phrases[currentIndex].class;
                display.classList.add('active');
            }, 500); // 0.5s de desvanecimiento
        }, 3000); // Cambia cada 3 segundos


        // --- 2. Generación continua de Flores y Corazones ---
        const floatingContainer = document.getElementById('floatingItemsContainer');
        const items = ['🌻', '🌻', '🌹', '🌸', '💙', '💜', '💖', '✨'];

        function spawnFloatingItem() {
            const item = document.createElement('div');
            item.className = 'floating-item';
            item.innerText = items[Math.floor(Math.random() * items.length)];
            
            const posX = Math.random() * 90 + 5; // 5% a 95% del ancho
            const posY = Math.random() * 80 + 10;
            const size = Math.random() * 1.5 + 1.2; // Tamaño variado

            item.style.left = `${posX}%`;
            item.style.top = `${posY}%`;
            item.style.fontSize = `${size}rem`;

            floatingContainer.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 4000);
        }

        setInterval(spawnFloatingItem, 400);


        // --- 3. Fuegos Artificiales Interactivos ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                this.velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                this.life = 70;
                this.opacity = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += 0.04; // Gravedad
                this.life--;
                this.opacity -= 0.015;
            }
        }

        let particles = [];

        function createFirework(x, y) {
            const colors = ['#ffd700', '#ff007f', '#00f0ff', '#ff3333', '#cc00ff', '#ffffff'];
            for (let i = 0; i < 40; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.life > 0 && p.opacity > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(i, 1);
                }
            }
        }
        animate();

        window.addEventListener('pointerdown', (e) => {
            createFirework(e.clientX, e.clientY);
        });
    </script>
</body>
</html>
